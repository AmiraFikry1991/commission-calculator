<style>
/* Layout: one working column. Month bar on top, tabs below, each tab a single operating surface. */
:root{
  --bg:#eaf3fc; --panel:#ffffff; --sunk:#f2f8fe; --ink:#1d3557; --muted:#5f7896; --line:#cfe0f2;
  --sea:#4a8fd4; --sea-ink:#ffffff; --brass:#3d6fa8; --brass-soft:#deecfb;
  --good:#2f8a5f; --good-soft:#e1f4ea; --warn:#a76a14; --warn-soft:#fdf1dd; --bad:#c0463f; --bad-soft:#fbe6e4;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.45rem}
h2{font-size:1.08rem}
h3{font-size:.95rem}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brandline{display:grid;gap:2px}
.brand{display:flex;gap:12px;align-items:center}
.brand img{width:48px;height:48px;flex:none}
.monthbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px}
.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{font-family:var(--f-mono)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;font-weight:600}
button.primary{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px}
.status.draft{background:var(--brass-soft);color:var(--brass)}
.status.closed{background:var(--good-soft);color:var(--good)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:none;background:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--sea)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi.lead{border-color:var(--sea);background:#dcebfb}
.kpi.lead .v{color:var(--sea)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:#e3effb;font-weight:600;position:sticky;top:0}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunk)}
tr.total td{font-weight:600;background:var(--sunk);border-top:2px solid var(--line)}
tr.detail td{background:var(--sunk);white-space:normal}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:4px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--brass-soft);color:var(--brass)}
.chip.plain{background:var(--sunk);color:var(--muted)}
.working{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px;padding:6px 2px}
.working dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:.85rem}
.working dt{color:var(--muted)}
.working dd{margin:0;font-family:var(--f-mono);text-align:right}
.working h4{margin:0 0 6px;font-family:var(--f-display);font-size:.82rem}
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.src{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;background:var(--panel)}
.src.loaded{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.src .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.src .used{font-size:.72rem;color:var(--muted)}
.mapper{border:1px dashed var(--sea);border-radius:8px;padding:14px;display:grid;gap:10px;background:var(--sunk)}
.maprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.notice{border-radius:8px;padding:12px 14px;font-size:.9rem;display:grid;gap:8px}
.notice.warn{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.info{background:var(--sunk);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
td input[type=text],td input[type=number],td input[type=date],td select{padding:5px 7px;width:100%}
td input.w-num{width:96px}
td input.w-name{min-width:150px}
td input.w-alias{min-width:170px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:20}
.readonly-note{font-size:.84rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
details.panel:not([open]){gap:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.demo-banner{border-color:#e8b04a!important;background:#fff6e0!important}
</style>
</head>

  const ignored=new Set((month.ignored||[]).map(norm));
  for(const r of src.rows){
    const nm=r.agent ?? r.owner; if(!norm(nm)) continue;
    const p=pm.get(norm(nm));
    if(!p){ if(!ignored.has(norm(nm))){ const u=unmatched.get(nm)||new Set(); u.add(src.label||key); unmatched.set(nm,u);} continue; }
    const list=out.get(p.name)||[]; list.push(r); out.set(p.name,list);
  }
  return out;
}
const sum = (list, f) => list ? list.reduce((a,r)=>a+(num(r[f])||0),0) : 0;
const avg = (list, f, conv=num) => { if(!list) return null; const v=list.map(r=>conv(r[f])).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };

function compute(settings, roster, month){
  const pm=personMap(roster), unmatched=new Map(), A={};
  for(const s of SOURCES) A[s.key]=aggregate(month,s.key,pm,unmatched);
  const rate=num(month.rate) ?? settings.rate, wd=num(month.workingDays) ?? settings.workingDays;
  const mid=month.id; const B=settings.bonus; const AT={...DEFAULT_SETTINGS.attendance, ...(settings.attendance||{})};
  const rows=[];
  for(const p of roster.people){
    const leftBefore = p.status==="left" && (!p.lastDay || p.lastDay < mid+"-01");
    if(leftBefore) continue;
    const inp=month.inputs?.[p.name]||{};
    const pax=sum(A.paxdeal.get(p.name),"pax"), deals=sum(A.paxdeal.get(p.name),"deals");
    const inAll=A.inboundAll.has(p.name)? sum(A.inboundAll.get(p.name),"calls") : null;
    const inNM=sum(A.inboundNoMissed.get(p.name),"calls"), outb=sum(A.outbound.get(p.name),"calls");
    const csat=avg(A.csat.get(p.name),"score"), nps=avg(A.nps.get(p.name),"score",ratio), lead=avg(A.leadScore.get(p.name),"score",ratio);
    const cRows=A.cancellations.get(p.name)||[];
    const cancels=cRows.reduce((a,r)=>a+(r.count!=null&&r.count!==""? (num(r.count)||0) : 1),0);
    const unreported=cRows.some(r=>no(r.reported));
    const conv = inAll ? deals/inAll : (deals>0? null : null);
    const policies=sum(A.insurance.get(p.name),"policies");
    const bonusRows=A.bonus.get(p.name)||[];
    const bonus=bonusRows.reduce((a,r)=>a+(num(r.bonus)||0)+(num(r.oneoff)||0),0);
    const reviews=(A.trustpilot.get(p.name)||[]);
    const days=num(inp.days), owed=num(inp.owed)||0;
    const stipend = p.stipend ? Math.round(num(p.stipend) * (days!=null? days/wd : 1)) : 0;
    const insurance=policies*B.insurance;
    const reviewRate = p.role==="Service" ? B.reviewService : (p.higherRate ? B.reviewHigher : B.reviewCM);
    const row={name:p.name, arabicName:p.arabicName||"", role:p.role, plan:p.plan||"none", pax, deals, inAll, inNM, outb, csat, nps, lead, cancels, conv, policies, bonus, stipend, insurance,
      reviewCount:reviews.length, reviewRate, owed, days, flags:[], commUSD:0, msUSD:0, override:(p.override===""||p.override==null)? null : num(p.override)};
    let reviewPay = reviews.length*reviewRate;
    const attIn = (inp.att!=null && inp.att!=="") ? ratio(inp.att) : avg(A.attendance.get(p.name),"pct",ratio);
    row.att=attIn; row.ramp=inRamp(p.startDate,mid,AT.rampDays); row.attLoss=0;
    const attApplies = AT.enabled && attIn!=null && !row.ramp;
    if(AT.enabled && row.plan!=="none"){ if(row.ramp) row.flags.push(["info","First "+AT.rampDays+" days, attendance not applied"]); else if(attIn==null) row.flags.push(["plain","No attendance data"]); }

    if(row.plan==="pax"){
      const fin=Math.max(0,pax-cancels); row.finalPax=fin;
      const tier=[...settings.pax.tiers].sort((a,b)=>a.min-b.min).filter(t=>fin>=t.min).pop();
      row.paxRate=tier? tier.rate : 0;
      row.effInbound = inNM + Math.floor(outb/(settings.pax.outboundPerCredit||10));
      let lvl=settings.pax.levels[0];
      for(const L of settings.pax.levels){
        const ok=(conv!=null && conv>=L.conv) && (L.csat==null || (csat!=null && csat>=L.csat)) && (L.nps==null || (nps!=null && nps>=L.nps)) && (L.inb==null || row.effInbound>=L.inb);
        if(ok && L.mult>=lvl.mult) lvl=L;
      }
      let cap=null;
      if(attApplies){
        if(attIn < AT.gate) cap={name:"Not Qualified", mult:0};
        else { const c=AT.caps.filter(x=>attIn>=x.min).sort((a,b)=>a.min-b.min).pop(); const L=c && settings.pax.levels.find(x=>x.name===c.level); if(L && L.mult<lvl.mult) cap=L; }
      }
      const base=fin*row.paxRate; row.levelEarned=lvl.name; row.multEarned=lvl.mult;
      const use = (cap && !AT.shadow) ? cap : lvl;
      row.level=use.name; row.mult=use.mult;
      row.commUSD = row.override!=null ? row.override : base*use.mult;
      if(cap && row.override==null){ const loss=base*(lvl.mult-cap.mult); if(loss>0.005){ row.attLoss=loss;
        row.flags.push(AT.shadow? ["plain","Trial: attendance would cost "+usd(loss)] : (cap.mult===0? ["bad","Attendance under "+Math.round(AT.gate*100)+"%"] : ["warn","Attendance caps level at "+cap.name])); } }
      if(fin < settings.pax.tiers[0].min && row.override==null) row.flags.push(["plain",`Below ${settings.pax.tiers[0].min} pax`]);
      if(inAll==null && pax>0) row.flags.push(["warn","No inbound data"]);
    } else if(row.plan==="fp"){
      const F=settings.fp, src=A.fpBookings.get(p.name)||[]; let io=0, bs=0, excluded=0;
      for(const b of src){
        const cab=num(b.cabins)||0; const isGroup=cab>=F.groupCabins;
        const when = isGroup ? (b.sail||b.fpDate) : b.fpDate;
        if(!when || !when.startsWith(mid)) continue;
        if(b.stage!=null && b.stage!=="" && !norm(b.stage).includes(norm(F.stage))) { excluded++; continue; }
        if(b.cancelled!=null && yes(b.cancelled)) { excluded++; continue; }
        if(p.lastDay && b.fpDate && b.fpDate>p.lastDay) { excluded++; continue; }
        if(/balcon|suite/i.test(b.category||"")) bs++; else io++;
      }
      const count=io+bs; row.fpCount=count; row.fpIO=io; row.fpBS=bs; row.fpExcluded=excluded;
      const tiers=[...F.tiers].sort((a,b)=>a.min-b.min); let idx=-1; tiers.forEach((t,i)=>{ if(count>=t.min) idx=i; });
      row.tierEarned=idx+1;
      const miss=[];
      const chk=(val,min,label)=>{ if(val==null){ if(!F.missingMet) miss.push(label+" (no data)"); } else if(val<min) miss.push(label); };
      chk(conv,F.conv,"Conversion"); chk(csat,F.csat,"CSAT"); chk(lead,F.lead,"Lead score");
      row.misses=miss;
      const paid = idx<0 ? -1 : Math.max(0, idx-miss.length);
      row.tierPaid=paid+1; const t=tiers[paid];
      row.fpRateIO=t? t.io:0; row.fpRateBS=t? t.bs:0;
      let fp = t ? io*t.io + bs*t.bs : 0;
      row.unreported=unreported;
      if(unreported){ fp=0; row.flags.push(["bad","Unreported cancellation"]); }
      if(attApplies && attIn<AT.gate && fp>0 && row.override==null){ row.attLoss=fp;
        if(AT.shadow) row.flags.push(["plain","Trial: attendance would cost "+usd(fp)]); else { fp=0; row.flags.push(["bad","Attendance under "+Math.round(AT.gate*100)+"%"]); } }
      row.fpUSD=fp;
      const before=num(p.depositsToDate)||0; row.depositsBefore=before; row.depositsNow=before+deals;
      row.ms20 = (!p.ms20Paid && row.depositsNow>=20) ? F.ms20 : 0;
      row.ms25 = (!p.ms25Paid && count>=25) ? F.ms25 : 0;
      row.msUSD=row.ms20+row.ms25;
      row.commUSD = row.override!=null ? row.override : fp;
      if(miss.length && idx>=0){ const dr=Math.min(miss.length,idx); row.flags.push(["warn", dr? `Dropped ${dr} tier${dr===1?"":"s"}` : "Missed a standard, already tier 1"]); }
      if(row.msUSD) row.flags.push(["good","Milestone"]);
      const low=reviews.filter(r=>num(r.stars)!=null && num(r.stars)<B.minStars).length;
      if(low){ reviewPay=0; row.flags.push(["bad",`Review under ${B.minStars} stars`]); }
    }
    if(row.override!=null && row.plan!=="none") row.flags.push(["info", row.override===0? "No commission (fixed 0)" : "Fixed amount"]);
    row.reviews=reviewPay;
    row.commEGP=(row.commUSD+row.msUSD+owed)*rate;
    row.bonusTotal=insurance+stipend+bonus+reviewPay;
    row.total=Math.round((row.commEGP+row.bonusTotal)*100)/100;
    row.deduct=num(inp.deduct)||0; row.deductNote=inp.deductNote||""; row.method=inp.method||"";
    row.final=Math.round((row.total-row.deduct)*100)/100;
    rows.push(row);
  }
  const tot=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  const attLossUSD=tot("attLoss");
  return {rows, rate, wd, unmatched, totals:{total:tot("total"), commEGP:tot("commEGP"), bonus:tot("bonusTotal"), stipend:tot("stipend"), insurance:tot("insurance"), extra:tot("bonus"), reviews:tot("reviews"), deduct:tot("deduct"), final:rows.reduce((a,r)=>a+Math.max(0,r.final),0), paid:rows.filter(r=>r.total>0).length, attLossUSD, attShadow:AT.enabled&&AT.shadow, attOn:AT.enabled}};
}


/* ---------------- local storage (replaces Claude's saved data when hosted on GitHub Pages) ----------------
   Everything is kept in this browser on this device, under one key. Use Download backup / Restore backup
   to move it to another device or keep a copy. */
const DEMO = new URLSearchParams(location.search).has("demo");
const LS_KEY = DEMO ? "cruisehub.commission.demo.v1" : "cruisehub.commission.original.v1";
function demoDocs(){ try{ return JSON.parse(document.getElementById("demoData").textContent).docs; }catch(e){ return {}; } }
const LocalStore=(()=>{
  let docs={}; let ok=true;
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); docs=d.docs||{}; } }catch(e){ ok=false; }
  if(DEMO && !Object.keys(docs).length) docs=demoDocs();
  const docSubs=new Map(), colSubs=new Map();
  const colOf=p=>p.split("/")[0];
  const snapDoc=p=>({exists: docs[p]!==undefined, id:p.split("/")[1], data:()=>JSON.parse(JSON.stringify(docs[p]))});
  const snapCol=c=>({docs:Object.keys(docs).filter(k=>colOf(k)===c&&k.includes("/")).map(k=>({id:k.split("/")[1], data:()=>JSON.parse(JSON.stringify(docs[k]))}))});
  function persist(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({app:"cruisehub-commission",version:1,savedAt:new Date().toISOString(),docs})); ok=true; }
    catch(e){ ok=false; const err=new Error("quota"); err.code="quota_exceeded"; throw err; }
  }
  function notify(p){
    (docSubs.get(p)||new Set()).forEach(cb=>cb(snapDoc(p)));
    (colSubs.get(colOf(p))||new Set()).forEach(cb=>cb(snapCol(colOf(p))));
  }
  function merge(base,patch){
    for(const [k,v] of Object.entries(patch)){
      if(v && typeof v==="object" && !Array.isArray(v) && v.__delete__===true){ delete base[k]; continue; }
      if(v && typeof v==="object" && !Array.isArray(v)){ if(!base[k]||typeof base[k]!=="object"||Array.isArray(base[k])) base[k]={}; merge(base[k],v); }
      else base[k]=v;
    }
    return base;
  }
  const strip=o=>JSON.parse(JSON.stringify(o));
  const db={
    doc(p){ return {
      onSnapshot(cb){ if(!docSubs.has(p)) docSubs.set(p,new Set()); docSubs.get(p).add(cb); setTimeout(()=>cb(snapDoc(p)),0); return ()=>docSubs.get(p).delete(cb); },
      async set(data){ const prev=docs[p]; docs[p]=strip(data); try{ persist(); }catch(e){ docs[p]=prev; throw e; } notify(p); },
      async update(patch){ const prev=docs[p]; docs[p]=merge(strip(docs[p]||{}),strip(patch)); try{ persist(); }catch(e){ docs[p]=prev; throw e; } notify(p); }
    }; },
    collection(c){ return { onSnapshot(cb){ if(!colSubs.has(c)) colSubs.set(c,new Set()); colSubs.get(c).add(cb); setTimeout(()=>cb(snapCol(c)),0); return ()=>colSubs.get(c).delete(cb); } }; }
  };
  return {
    db, get ok(){ return ok; },
    exportJSON(){ return JSON.stringify({app:"cruisehub-commission",version:1,savedAt:new Date().toISOString(),docs},null,1); },
    importJSON(text){
      const d=JSON.parse(text); if(!d||d.app!=="cruisehub-commission"||!d.docs) throw new Error("not a backup");
      const prev=docs; docs=d.docs; try{ persist(); }catch(e){ docs=prev; throw e; }
      const paths=new Set([...Object.keys(prev),...Object.keys(docs),...docSubs.keys()]); paths.forEach(notify);
      return {people:(docs["config/roster"]?.people||[]).length, months:Object.keys(docs).filter(k=>k.startsWith("months/")).length};
    },
    hasData(){ return Object.keys(docs).length>0; }
  };
})();
function saveFile(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
const localDownloads={ async save({filename,data}){ saveFile(filename,data); } };

/* ---------------- db wiring ---------------- */
async function init(){
  try{
    S.db=LocalStore.db; S.downloads=localDownloads; S.canEdit=true;
  }catch(e){ S.db=null; }
  if(!S.db){ S.dbMissing=true; S.settings=clone(DEFAULT_SETTINGS); S.roster={people:[]}; S.months=[]; S.ready={settings:true,roster:true,months:true}; render(); return; }
  S.db.doc("config/settings").onSnapshot(s=>{ S.settings = s.exists ? {...clone(DEFAULT_SETTINGS), ...s.data()} : clone(DEFAULT_SETTINGS); S.ready.settings=true; render(); }, err);
  S.db.doc("config/roster").onSnapshot(s=>{ S.roster = s.exists ? clone(s.data()) : {people:[]}; S.roster.people ||= []; S.ready.roster=true; render(); }, err);
  S.db.collection("months").onSnapshot(q=>{
    S.months=q.docs.map(d=>d.id).sort(); S.ready.months=true;
    if(!S.monthId || !S.months.includes(S.monthId)) selectMonth(S.months[S.months.length-1]||null); else render();
  }, err);
}
function err(e){ console.warn(e); toast("Couldn't read saved data in this browser."); }
function selectMonth(id){
  if(S.unsubMonth){ S.unsubMonth(); S.unsubMonth=null; }
  S.monthId=id; S.month=null;
  if(!id){ render(); return; }
  S.unsubMonth=S.db.doc("months/"+id).onSnapshot(s=>{ S.month = s.exists ? clone(s.data()) : null; if(S.month) S.month.id=id; render(); }, err);
  render();
}
async function write(path, data, how="set"){
  if(!S.db || !S.canEdit){ toast("Saving is unavailable in this browser."); return false; }
  try{ await S.db.doc(path)[how](data); return true; }
  catch(e){ if(e.code==="quota_exceeded"||e.code==="invalid_argument") toast("That didn't save: this browser's storage is full. Download a backup, then remove old months' uploads."); else toast("That didn't save. Download a backup so nothing is lost."); return false; }
}
const saveSettings = () => write("config/settings", S.settings);
const saveRoster = () => write("config/roster", S.roster);
const saveMonth = patch => write("months/"+S.monthId, patch, "update");

let renderQueued=false;
function render(){
  const ae=document.activeElement;

  renderQueued=false;
  if(!(S.ready.settings&&S.ready.roster&&S.ready.months)) return;
  const app=$("#app"); const sy=window.scrollY;
  const calc = S.month ? (S.month.closed && S.month.snapshot ? S.month.snapshot : compute(S.settings,S.roster,S.month)) : null;
  if(calc && !(calc.unmatched instanceof Map)) calc.unmatched=new Map(Object.entries(calc.unmatched||{}).map(([k,v])=>[k,new Set(v)]));

}

function resultsHTML(c, plan){

  const body=mine.map(r=>{ const open=S.open[r.name]; return `<tr class="clickable" data-open="${esc(r.name)}" aria-expanded="${!!open}">
      <td><strong>${esc(r.name)}</strong><div class="muted small">${esc(r.role||"")}</div></td>${cells(r)}
      <td class="r num">${egp(r.commEGP)}</td><td class="r num">${egp(r.insurance)}${r.policies?`<div class="muted small">${r.policies} polic${r.policies===1?"y":"ies"}</div>`:""}</td><td class="r num">${egp(r.stipend)}${r.days!=null?`<div class="muted small">${r.days} days</div>`:""}</td><td class="r num">${egp(r.bonus)}</td><td class="r num">${egp(r.reviews)}${r.reviewCount?`<div class="muted small">${r.reviewCount} × ${r.reviewRate}</div>`:""}</td><td class="r num"><strong>${egp(r.total)}</strong></td><td>${chips(r)}</td></tr>
      ${open?`<tr class="detail"><td colspan="${n}">${workingHTML(r,c)}</td></tr>`:""}`; }).join("");
  const planTotal=sumOf(mine,"total");
  return `
  ${!loaded && !m.closed? `<div class="notice info"><strong>No exports uploaded for ${monthLabel(m.id)} yet.</strong><span>Everyone shows stipends only until you add this month's reports.</span>${S.canEdit?`<div><button class="primary" data-tab="data">Upload exports</button></div>`:""}</div>`:""}
  ${um.length && !m.closed? `<div class="notice warn"><strong>${um.length} name${um.length>1?"s":""} in your files match nobody on the team.</strong><span>Their numbers are not counted anywhere. Link each one to a person, or mark it as not a person.</span>
    <div class="tablewrap"><table><thead><tr><th>Name in file</th><th>Found in</th><th>Link to</th><th></th></tr></thead><tbody>
    ${um.map(([nm,set])=>`<tr><td><strong>${esc(nm)}</strong></td><td class="small">${esc([...set].join(", "))}</td>
      <td><select data-linksel="${esc(nm)}" ${S.canEdit?"":"disabled"}><option value="">Choose person…</option>${S.roster.people.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></td>
      <td><button class="ghost small" data-ignore="${esc(nm)}" ${S.canEdit?"":"disabled"}>Not a person</button></td></tr>`).join("")}
    </tbody></table></div></div>`:""}
  ${c.totals.attOn? `<div class="notice info"><span><strong>Attendance ${c.totals.attShadow?"trial month":"is applied"}.</strong> ${c.totals.attShadow? `Figures below are paid as if attendance didn't count. Under the new attendance rules this month would cost the team <strong>${usd(c.totals.attLossUSD||0)}</strong> (${egp((c.totals.attLossUSD||0)*c.rate)} EGP).` : "Below 90% attendance means no commission that month, and attendance caps the multiplier level."} Change this on Rates &amp; rules.</span></div>`:""}
  <section class="kpis">
    <div class="kpi lead"><span class="eyebrow">${isPax?"Old rules total":"New rules total"}</span><span class="v">${egp(planTotal)} EGP</span><span class="small muted">${mine.length} ${mine.length===1?"person":"people"} on this plan</span></div>
    <div class="kpi"><span class="eyebrow">Commission on this plan</span><span class="v">${egp(sumOf(mine,"commEGP"))}</span><span class="small muted">at ${fmt(c.rate,2)} EGP per USD</span></div>
    <div class="kpi"><span class="eyebrow">Stipends + bonuses on this plan</span><span class="v">${egp(sumOf(mine,"bonusTotal"))}</span><span class="small muted">${c.wd} working days</span></div>
    <div class="kpi"><span class="eyebrow">Whole payroll, all plans</span><span class="v">${egp(c.totals.total)}</span><span class="small muted">${c.totals.paid} people paid</span></div>
  </section>
  <section class="panel">
    <div class="spread"><div><h2>${isPax?"Old rules: pax commission":"New rules: FP bonus"} · ${monthLabel(m.id)}</h2>
      <p class="small muted">${isPax?"Final pax × rate per pax × performance multiplier.":"FP bookings at the month's tier rate, one tier lower per missed standard, plus milestones."}</p></div>
      <div class="row">
        <button id="copyPay">Copy HR payroll</button>
        ${S.downloads? `<button id="dlPay">Download payroll CSV</button><button id="dlDetail" class="ghost">Download full detail</button>`:""}
        ${S.canEdit? (m.closed? `<button id="reopen" class="ghost">Reopen month</button>` : `<button id="closeMonth" class="primary">Close month</button>`):""}
      </div></div>
    ${S.confirmClose? `<div class="notice info"><strong>Close ${monthLabel(m.id)}?</strong><span>This freezes both plans' figures and carries deposits and milestones forward to next month. You can reopen it later.</span><div class="row"><button class="primary" id="confirmClose">Close month</button><button class="ghost" id="cancelClose">Cancel</button></div></div>`:""}
    <div class="tablewrap"><table>
      <thead><tr>${cols.map(([l,cl])=>`<th class="${cl||""}">${l}</th>`).join("")}</tr></thead>
      <tbody>${body || `<tr><td colspan="${n}" class="empty">Nobody is on this plan. Change a person's plan on the Team tab.</td></tr>`}
      ${mine.length?`<tr class="total"><td colspan="${n-7}">Total</td><td class="r num">${egp(sumOf(mine,"commEGP"))}</td><td class="r num">${egp(sumOf(mine,"insurance"))}</td><td class="r num">${egp(sumOf(mine,"stipend"))}</td><td class="r num">${egp(sumOf(mine,"bonus"))}</td><td class="r num">${egp(sumOf(mine,"reviews"))}</td><td class="r num">${egp(planTotal)}</td><td></td></tr>`:""}</tbody>
    </table></div>

  </section>
  ${others.length?`<details class="panel"><summary>Stipends and bonuses only · ${others.length} people · ${egp(sumOf(others,"total"))} EGP</summary>
    <div class="tablewrap"><table><thead><tr><th>Person</th><th class="r">Insurance</th><th class="r">Stipend</th><th class="r">Bonus</th><th class="r">Reviews</th><th class="r">Total EGP</th></tr></thead><tbody>
    ${others.map(r=>`<tr><td><strong>${esc(r.name)}</strong><div class="muted small">${esc(r.role||"")}</div></td><td class="r num">${egp(r.insurance)}</td><td class="r num">${egp(r.stipend)}</td><td class="r num">${egp(r.bonus)}</td><td class="r num">${egp(r.reviews)}</td><td class="r num"><strong>${egp(r.total)}</strong></td></tr>`).join("")}
    </tbody></table></div></details>`:""}`;
}
function workingHTML(r,c){
  const dl=pairs=>`<dl>${pairs.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
  const S2=S.settings;
  let plan="";
  if(r.plan==="pax") plan=`<div><h4>Pax commission</h4>${dl([["Pax booked",r.pax],["Cancellations","- "+r.cancels],["Final pax",r.finalPax],["Rate per pax",usd(r.paxRate)],["Inbound (no missed)",r.inNM],["Outbound credit",`${r.outb} ÷ ${S2.pax.outboundPerCredit} = ${Math.floor(r.outb/S2.pax.outboundPerCredit)}`],["Effective inbound",r.effInbound],["Level earned",esc(r.levelEarned||r.level)],["Level paid",esc(r.level)+(r.attLoss&&!S.settings.attendance?.shadow?" (attendance)":"")],["Multiplier",r.mult.toFixed(3)+"x"],["Commission",r.override!=null?usd(r.override)+" (fixed)":`${r.finalPax} × ${usd(r.paxRate)} × ${r.mult.toFixed(3)} = ${usd(r.commUSD)}`]])}</div>`;
  if(r.plan==="fp") plan=`<div><h4>FP bonus</h4>${dl([["Inside / Oceanview",r.fpIO+" × "+usd(r.fpRateIO)],["Balcony / Suite",r.fpBS+" × "+usd(r.fpRateBS)],["FP bookings counted",r.fpCount],["Rows not counted",r.fpExcluded||0],["Tier earned",r.tierEarned||"-"],["Standards missed",r.misses.length? esc(r.misses.join(", ")):"None"],["Tier paid",r.tierPaid||"-"],["FP bonus",r.unreported? "0 (unreported cancellation)" : usd(r.fpUSD)],["Deposits to date",`${r.depositsBefore} + ${r.deals} = ${r.depositsNow}`],["Milestones",usd(r.msUSD)]])}</div>`;
  return `<div class="working">
    <div><h4>Activity</h4>${dl([["Deals",r.deals],["Pax",r.pax],["Inbound incl. missed",r.inAll??"no data"],["Conversion",pct(r.conv)],["Attendance",r.ramp?"first 90 days, exempt":(r.att==null?"no data":pct(r.att))],["CSAT",r.csat==null?"no data":fmt(r.csat,2)],["NPS",r.nps==null?"no data":pct(r.nps)],["Lead score",r.lead==null?"no data":pct(r.lead)],["Cancellations",r.cancels]])}</div>
    ${plan}
    <div><h4>Payout</h4>${dl([["Commission USD",usd(r.commUSD)],["Milestones USD",usd(r.msUSD)],["Last month owed USD",usd(r.owed)],["× rate",fmt(c.rate,2)],["Commission EGP",egp(r.commEGP)],["Insurance",`${r.policies} × ${S2.bonus.insurance} = ${egp(r.insurance)}`],["Transport stipend",egp(r.stipend)+(r.days!=null?` (${r.days} of ${c.wd} days)`:"")],["Bonus incentive",egp(r.bonus)],["Reviews",`${r.reviewCount} × ${r.reviewRate} = ${egp(r.reviews)}`],["Total EGP","<strong>"+egp(r.total)+"</strong>"]])}</div>
  </div>`;
}

function transfersHTML(c){

  <section class="panel">

        <td class="r num">${egp(r.total)}</td>
        <td class="r"><input type="number" step="1" min="0" class="w-num" data-inp="deduct" data-who="${esc(r.name)}" value="${esc(r.deduct||"")}" placeholder="0" ${ro?"disabled":""} aria-label="Deduction for ${esc(r.name)}"></td>
        <td><input type="text" class="w-alias" data-inp="deductNote" data-who="${esc(r.name)}" value="${esc(r.deductNote||"")}" placeholder="e.g. advance 1 Oct" ${ro?"disabled":""} aria-label="Reason for ${esc(r.name)}"></td>
        <td class="r num"><strong style="color:${f<0?"var(--bad)":"var(--ink)"}">${egp(f)}</strong></td>
        <td><select data-inp="method" data-who="${esc(r.name)}" ${ro?"disabled":""} aria-label="Payment method for ${esc(r.name)}">${methods.map(x=>`<option value="${x}" ${x===(r.method||"")?"selected":""}>${x||"Choose…"}</option>`).join("")}</select></td></tr>`; }).join("")}

/* ---- uploads & adjustments ---- */
function dataHTML(c){
  const m=S.month, ro=!S.canEdit||m.closed;
  const plansInUse=new Set(S.roster.people.map(p=>p.plan));
  const cards=SOURCES.map(s=>{
    const src=m.sources?.[s.key]; const rel = s.plan==="both" || plansInUse.has(s.plan);
    return `<div class="src ${src?"loaded":""}">
      <div class="head"><div><h3>${esc(s.label)}</h3><div class="used">${s.plan==="fp"?"FP plan":s.plan==="pax"?"Pax plan":"Both plans"}${rel?"":" · nobody on this plan"}</div></div>
      ${src? `<span class="chip good">${src.rows.length} rows</span>`:`<span class="chip plain">Not uploaded</span>`}</div>
      ${src? `<div class="small muted">${esc(src.file)} · ${esc((src.at||"").slice(0,10))}</div>`:""}
      ${ro?"":`<div class="row"><label class="small"><input type="file" accept=".xlsx,.xls,.csv" data-file="${s.key}" style="max-width:100%"></label>${src?`<button class="ghost small danger" data-clear="${s.key}">Remove</button>`:""}</div>`}
    </div>`;
  }).join("");
  const mp=S.pending;
  const mapper = mp ? `<div class="mapper"><div class="spread"><h3>Match columns: ${esc(SOURCES.find(s=>s.key===mp.key).label)} · ${esc(mp.file)}</h3><span class="small muted">${mp.data.length} data rows</span></div>
    ${mp.sheets.length>1? `<div class="field" style="max-width:280px"><label for="mpSheet">Sheet</label><select id="mpSheet">${mp.sheets.map(n=>`<option ${n===mp.sheet?"selected":""}>${esc(n)}</option>`).join("")}</select></div>`:""}
    <div class="maprow">${SOURCES.find(s=>s.key===mp.key).fields.map(([f,label,,opt])=>`<div class="field"><label for="map_${f}">${esc(label)}${opt?" (optional)":""}</label><select id="map_${f}" data-map="${f}"><option value="">${opt?"Not in this file":"Choose column…"}</option>${mp.headers.map((h,i)=>`<option value="${i}" ${mp.map[f]===i?"selected":""}>${esc(h||"Column "+(i+1))}</option>`).join("")}</select></div>`).join("")}</div>
    <div class="row"><button class="primary" id="mpSave">Save to ${monthLabel(m.id)}</button><button class="ghost" id="mpCancel">Cancel</button><span class="small muted">I guessed the columns from the headers. Check them before saving.</span></div></div>` : "";
  const people=c.rows;
  const adj=`<section class="panel"><div><h2>Month adjustments</h2><p class="small muted">Days worked prorates the transport stipend for joiners and leavers. Leave blank for a full month. Attendance % only needs typing if it isn't in the attendance upload or is wrong there (type 96 for 96%). Last month owed is in USD and is converted at this month's rate.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Person</th><th>Days worked</th><th>Attendance % (overrides upload)</th><th>Last month owed (USD)</th><th>Note</th></tr></thead><tbody>
    ${people.map(r=>{ const i=m.inputs?.[r.name]||{}; return `<tr><td>${esc(r.name)}</td>
      <td><input type="number" class="w-num" data-inp="days" data-who="${esc(r.name)}" value="${esc(i.days??"")}" placeholder="full" ${ro?"disabled":""}></td>
      <td><input type="number" step="0.1" class="w-num" data-inp="att" data-who="${esc(r.name)}" value="${esc(i.att??"")}" placeholder="${r.att==null?"":(r.att*100).toFixed(1)}" ${ro?"disabled":""}></td>
      <td><input type="number" step="0.01" class="w-num" data-inp="owed" data-who="${esc(r.name)}" value="${esc(i.owed??"")}" placeholder="0" ${ro?"disabled":""}></td>
      <td><input type="text" data-inp="note" data-who="${esc(r.name)}" value="${esc(i.note??"")}" ${ro?"disabled":""}></td></tr>`; }).join("")}
    </tbody></table></div></section>`;
  return `<section class="panel"><div class="spread"><div><h2>Exports for ${monthLabel(m.id)}</h2><p class="small muted">Upload each report as it comes out of HubSpot, AiCall or the review export, in Excel or CSV. Uploading again replaces the earlier file.</p></div></div>
    ${m.closed?`<div class="notice info">This month is closed. Reopen it on either plan tab to change files.</div>`:""}
    ${mapper}<div class="sources">${cards}</div></section>${adj}`;
}

    <td><input type="checkbox" data-p="${i}" data-f="ms20Paid" ${p.ms20Paid?"checked":""} ${ro?"disabled":""} aria-label="20 deposits milestone paid"></td>
    <td><input type="checkbox" data-p="${i}" data-f="ms25Paid" ${p.ms25Paid?"checked":""} ${ro?"disabled":""} aria-label="25 FP bookings milestone paid"></td>
    <td>${ro?"":(S.confirmDel===i? `<button class="danger small" data-delyes="${i}">Remove</button>` : `<button class="ghost small" data-del="${i}" aria-label="Remove ${esc(p.name)}">✕</button>`)}</td></tr>`).join("") || `<tr><td colspan="15" class="empty">No one yet. Add your first person.</td></tr>`}
  </tbody></table></div>
  <p class="small muted">Deposits to date and the milestone ticks update automatically when you close a month.</p></section>`;
}

/* ---------------- uploads ---------------- */
function readFile(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ try{ res(XLSX.read(fr.result,{type:"array",cellDates:true})); }catch(e){ rej(e);} }; fr.onerror=rej; fr.readAsArrayBuffer(file); });
}
function sheetRows(wb,name){
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
  let h=aoa.findIndex(r=>r.filter(v=>String(v).trim()!=="").length>=2); if(h<0) h=0;
  const headers=(aoa[h]||[]).map(v=>String(v).trim());
  const data=aoa.slice(h+1).filter(r=>r.some(v=>String(v).trim()!==""));
  return {headers,data};
}
function guessMap(src,headers){
  const map={}, used=new Set(); const H=headers.map(norm);
  for(const [f,,words] of src.fields){
    let best=-1;
    for(const w of words){ const i=H.findIndex((h,ix)=>!used.has(ix)&&h.includes(w)); if(i>=0){best=i;break;} }
    if(best>=0){ map[f]=best; used.add(best); }
  }
  return map;
}
async function onFile(key,file){
  if(!window.XLSX){ toast("The spreadsheet reader didn't load. Reload the page and try again."); return; }
  try{
    const wb=await readFile(file); const src=SOURCES.find(s=>s.key===key);
    const hints=[norm(src.label), norm(src.label).split(" (")[0], ...(src.key==="trustpilot"?["trustpilot","trust pilot"]:[]), ...(src.key==="inboundNoMissed"?["no missed"]:[]), ...(src.key==="inboundAll"?["inbound all"]:[])];
    const sheet=wb.SheetNames.find(n=>hints.some(h=>h && norm(n).includes(h))) || wb.SheetNames.find(n=>hints.some(h=>h && h.includes(norm(n)) && norm(n).length>2)) || wb.SheetNames[0];
    const {headers,data}=sheetRows(wb,sheet);
    S.pending={key,file:file.name,wb,sheets:wb.SheetNames,sheet,headers,data,map:guessMap(src,headers)};
    render();
  }catch(e){ toast("That file couldn't be read. Save it as .xlsx or .csv and try again."); }
}
async function savePending(){
  const mp=S.pending, src=SOURCES.find(s=>s.key===mp.key);
  for(const [f,label,,opt] of src.fields) if(!opt && mp.map[f]==null){ toast(`Choose the column for ${label}.`); return; }
  const dateF=new Set(["fpDate","sail"]);
  const rows=mp.data.map(r=>{ const o={}; for(const [f] of src.fields){ const i=mp.map[f]; if(i==null) continue; let v=r[i]; if(dateF.has(f)) v=isoDate(v); else if(v instanceof Date) v=isoDate(v); else v=(typeof v==="string")? v.trim() : v; o[f]=v; } return o; })
    .filter(o=>norm(o.agent??o.owner) && !/^(total|grand total|sum)$/i.test(String(o.agent??o.owner).trim()));
  const ok=await saveMonth({sources:{[mp.key]:{file:mp.file,at:new Date().toISOString(),label:src.label,rows}}});
  if(ok){ S.pending=null; toast(`${src.label}: ${rows.length} rows saved`); render(); }
}

/* ---------------- exports ---------------- */
function currentCalc(){ return S.month.closed && S.month.snapshot ? S.month.snapshot : compute(S.settings,S.roster,S.month); }
function csv(rows){ return rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\r\n"); }
function payrollRows(c){ const f=r=>r.final??r.total; const list=c.rows.filter(r=>r.total>0||r.deduct); return [["Western name","Arabic name","Role","Plan","Commission EGP","Insurance EGP","Transport EGP","Bonus EGP","Reviews EGP","Earned EGP","Deduction EGP","Deduction reason","Final transfer EGP","Paid by"], ...list.map(r=>[r.name,r.arabicName||"",r.role,PLANS[r.plan],Math.round(r.commEGP),r.insurance,r.stipend,r.bonus,r.reviews,Math.round(r.total),r.deduct||0,r.deductNote||"",Math.round(Math.max(0,f(r))),r.method||""]), ["TOTAL","","","",Math.round(c.totals.commEGP),c.totals.insurance,c.totals.stipend,c.totals.extra,c.totals.reviews,Math.round(c.totals.total),c.rows.reduce((a,r)=>a+(r.deduct||0),0),"",Math.round(c.rows.reduce((a,r)=>a+Math.max(0,f(r)),0)),""]]; }
function detailRows(c){ return [["Western name","Arabic name","Role","Plan","Deals","Pax","Final pax","FP bookings","Inbound incl missed","Conversion","Attendance","CSAT","NPS","Lead score","Cancellations","Level / tier paid","Multiplier","Commission USD","Milestones USD","Owed USD","Rate","Commission EGP","Insurance","Stipend","Bonus","Reviews","Total EGP","Deduction EGP","Deduction reason","Final transfer EGP","Paid by","Checks"],
  ...c.rows.map(r=>[r.name,r.arabicName||"",r.role,PLANS[r.plan],r.deals,r.pax,r.finalPax??"",r.fpCount??"",r.inAll??"",r.conv==null?"":(r.conv*100).toFixed(1)+"%",r.att==null?"":(r.att*100).toFixed(1)+"%",r.csat??"",r.nps==null?"":(r.nps*100).toFixed(1)+"%",r.lead==null?"":(r.lead*100).toFixed(1)+"%",r.cancels,r.plan==="pax"?r.level:r.plan==="fp"?"Tier "+r.tierPaid:"",r.mult??"",r.commUSD.toFixed(2),r.msUSD,r.owed,c.rate,r.commEGP.toFixed(2),r.insurance,r.stipend,r.bonus,r.reviews,r.total.toFixed(2),r.deduct||0,r.deductNote||"",(r.final??r.total).toFixed(2),r.method||"",r.flags.map(f=>f[1]).join("; ")])]; }
async function download(name,rows){
  try{ await S.downloads.save({filename:name,data:new Blob(["﻿"+csv(rows)],{type:"text/csv"})}); }
  catch(e){ if(e.code!=="declined") toast("The download didn't start. Use Copy HR payroll instead."); }
}

/* ---------------- events ---------------- */
function setPath(obj,path,val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=val; }
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,tr[data-open]"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{localStorage.setItem("chcc.tab",S.tab);}catch(_){} render(); return; }
  if(t.dataset.open!=null){ S.open[t.dataset.open]=!S.open[t.dataset.open]; render(); return; }
  if(t.id==="newMonth"||t.id==="newMonth2"){
    const id = S.months.length ? nextMonthId(S.months[S.months.length-1]) : currentMonthId();
    const prev = S.month;
    if(await write("months/"+id,{id,rate:prev?.rate??S.settings.rate,workingDays:S.settings.workingDays,sources:{},inputs:{},ignored:prev?.ignored||[],closed:false})){ selectMonth(id); toast(monthLabel(id)+" started"); }
    return;
  }
  if(t.id==="resetDemo"){ if(confirm("Put the demo back to its starting figures?")){ try{ localStorage.removeItem(LS_KEY); }catch(_){} location.reload(); } return; }
  if(t.id==="backupData"){ saveFile(`cruisehub-commission-backup-${new Date().toISOString().slice(0,10)}.json`, new Blob([LocalStore.exportJSON()],{type:"application/json"})); toast("Backup downloaded. Keep it somewhere safe."); return; }
  if(t.id==="restoreData"){ $("#restoreFile").click(); return; }
  if(t.dataset.clear){ await saveMonth({sources:{[t.dataset.clear]:{"__delete__":true}}}); return; }
  if(t.id==="mpCancel"){ S.pending=null; render(); return; }
  if(t.id==="mpSave"){ savePending(); return; }
  if(t.dataset.ignore){ const ig=[...(S.month.ignored||[]),t.dataset.ignore]; await saveMonth({ignored:ig}); return; }
  if(t.id==="addPerson"){ S.roster.people.push({name:"New person",aliases:"",role:"Cruise Manager",plan:"fp",stipend:2000,status:"active"}); await saveRoster(); return; }
  if(t.dataset.del!=null){ S.confirmDel=+t.dataset.del; render(); return; }
  if(t.dataset.delyes!=null){ S.roster.people.splice(+t.dataset.delyes,1); S.confirmDel=null; await saveRoster(); return; }
  if(t.id==="copyPay"){ const rows=payrollRows(currentCalc()).map(r=>r.join("\t")).join("\n"); try{ await navigator.clipboard.writeText(rows); toast("Transfer list copied. Paste it into Sheets or an email."); }catch(_){ toast("Copy isn't allowed here. Use Download payroll CSV."); } return; }
  if(t.id==="dlPay"){ download(`CruiseHub_${S.monthId}_Bank_Transfers.csv`,payrollRows(currentCalc())); return; }
  if(t.id==="dlDetail"){ download(`CruiseHub_${S.monthId}_Commission_Detail.csv`,detailRows(currentCalc())); return; }
  if(t.id==="closeMonth"){ S.confirmClose=true; render(); return; }
  if(t.id==="cancelClose"){ S.confirmClose=false; render(); return; }
  if(t.id==="confirmClose"){
    const c=compute(S.settings,S.roster,S.month); const effects={};
    for(const r of c.rows){ if(r.plan!=="fp") continue; const p=S.roster.people.find(x=>x.name===r.name); if(!p) continue;
      effects[p.name]={depositsToDate:p.depositsToDate??0,ms20Paid:!!p.ms20Paid,ms25Paid:!!p.ms25Paid};
      p.depositsToDate=r.depositsNow; if(r.ms20) p.ms20Paid=true; if(r.ms25) p.ms25Paid=true; }
    const snap={...c, unmatched:Object.fromEntries([...c.unmatched].map(([k,v])=>[k,[...v]]))};
    if(await saveMonth({closed:true,closedAt:new Date().toISOString(),snapshot:snap,closeEffects:effects})){ await saveRoster(); S.confirmClose=false; toast(monthLabel(S.monthId)+" closed"); }
    return;
  }
  if(t.id==="reopen"){
    const eff=S.month.closeEffects||{}; for(const [n,v] of Object.entries(eff)){ const p=S.roster.people.find(x=>x.name===n); if(p) Object.assign(p,v); }
    if(await saveMonth({closed:false,snapshot:{"__delete__":true},closeEffects:{"__delete__":true}})){ await saveRoster(); toast("Month reopened"); }
    return;
  }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="restoreFile"){ const f=t.files[0]; t.value=""; if(!f) return;
    try{ const text=await f.text(); if(LocalStore.hasData() && !confirm("Replace everything in this browser with this backup? Download a backup of the current data first if you need it.")) return;
      const r=LocalStore.importJSON(text); S.pending=null; toast(`Restored ${r.people} people and ${r.months} month${r.months===1?"":"s"}`); }
    catch(err){ toast("That file isn't a backup from this calculator."); }
    return; }
  if(t.id==="monthSel"){ S.pending=null; selectMonth(t.value); return; }
  if(t.id==="mRate"){ await saveMonth({rate:num(t.value)}); return; }
  if(t.id==="mWd"){ await saveMonth({workingDays:num(t.value)}); return; }
  if(t.dataset.file){ const f=t.files[0]; if(f) onFile(t.dataset.file,f); return; }
  if(t.id==="mpSheet"){ const mp=S.pending; const {headers,data}=sheetRows(mp.wb,t.value); Object.assign(mp,{sheet:t.value,headers,data,map:guessMap(SOURCES.find(s=>s.key===mp.key),headers)}); render(); return; }
  if(t.dataset.map){ S.pending.map[t.dataset.map]= t.value===""? null : +t.value; return; }
  if(t.dataset.linksel){ if(!t.value) return; const p=S.roster.people.find(x=>x.name===t.value); const al=(p.aliases||"").split(",").map(s=>s.trim()).filter(Boolean); al.push(t.dataset.linksel); p.aliases=al.join(", "); if(await saveRoster()) toast(`${t.dataset.linksel} now counts for ${p.name}`); return; }
  if(t.dataset.inp){ const who=t.dataset.who, k=t.dataset.inp; const v = ["note","deductNote","method"].includes(k) ? t.value : num(t.value); await saveMonth({inputs:{[who]:{[k]:v}}}); return; }
  if(t.dataset.p!=null){ const p=S.roster.people[+t.dataset.p], f=t.dataset.f;
    let v = t.type==="checkbox" ? t.checked : t.value;
    if(["stipend","depositsToDate"].includes(f)) v=num(v); if(f==="override") v= t.value===""? null : num(v);
    if(f==="name"){ const old=p.name; v=v.trim(); if(!v) return; if(S.month?.inputs?.[old] && !S.month.closed){ await saveMonth({inputs:{[v]:S.month.inputs[old],[old]:{"__delete__":true}}}); } }
    p[f]=v; await saveRoster(); return; }
  if(t.dataset.set){ const v = t.type==="number" ? (t.value===""? null : num(t.value)) : t.value; setPath(S.settings,t.dataset.set,v); await saveSettings(); return; }
  if(t.dataset.setbool){ setPath(S.settings,t.dataset.setbool,t.checked); await saveSettings(); return; }
});

init();
</script>
