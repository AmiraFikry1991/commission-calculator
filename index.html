<style>
/* Day1 internal tools theme */
:root{
  --bg:#f2f3f5; --panel:#ffffff; --sunk:#f7f8fa; --ink:#1f2933; --muted:#6b7480; --line:#dde1e6; --line-2:#c9ced5;
  --brand:#0e2a4a; --brand-2:#163a63; --accent:#1d64a8; --accent-ink:#ffffff;
  --sea:var(--accent); --sea-ink:#fff; --brass:var(--brand-2); --brass-soft:#e8edf3;
  --good:#1e7a46; --good-soft:#e6f2ea; --warn:#8a5a00; --warn-soft:#fbf3e2; --bad:#b42318; --bad-soft:#fbeae8;
  --f-display:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding:0 0 40px;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:14px;padding:0 16px}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;letter-spacing:0}
h1{font-size:1.05rem;font-weight:400}
h2{font-size:1rem}
h3{font-size:.92rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;color:var(--muted);font-weight:600}
/* top bar */
header.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;background:var(--brand);color:#fff;margin-inline:calc(50% - 50vw);padding:12px max(16px,calc(50vw - 50%)) 14px;border-bottom:3px solid var(--accent)}
.brand{display:flex;gap:12px;align-items:center;align-self:center}
.brand .logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;color:#fff;padding-right:12px;border-right:1px solid rgba(255,255,255,.3);line-height:1}
.brand h1{color:#dbe4ef}
.monthbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
header.top .field label{color:#b9c6d6}
header.top input,header.top select{border-color:transparent}
header.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
header.top button:hover{background:rgba(255,255,255,.1)}
.field{display:grid;gap:3px}
.field label{font-size:.75rem;color:var(--muted);font-weight:600}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],select{background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:3px;padding:6px 8px;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border-radius:3px;border:1px solid var(--line-2);background:#fff;padding:6px 12px;font-weight:600;font-size:.86rem}
button:hover{background:var(--sunk)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{background:#17558f}
button.ghost{background:#fff}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.status{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:2px;align-self:center}
.status.draft{background:#f0c75e;color:#3d2b00}
.status.closed{background:#cfe8d8;color:#14532d}
/* tabs */
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-2);overflow-x:auto;background:#fff;margin-inline:calc(50% - 50vw);padding:0 max(16px,calc(50vw - 50%))}
nav.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;padding:11px 14px;color:var(--muted);white-space:nowrap;font-weight:600}
nav.tabs button:hover{color:var(--ink);background:none}
nav.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--accent)}
/* surfaces */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:4px}
.kpi{padding:12px 16px;display:grid;gap:2px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi .eyebrow{font-weight:400}
.kpi .v{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi.lead{box-shadow:inset 3px 0 0 var(--accent)}
.kpi.lead .v{color:var(--brand)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid #eceef1;white-space:nowrap;vertical-align:middle}
th{font-size:.78rem;color:#3c4652;background:#f4f5f7;font-weight:600;position:sticky;top:0;border-bottom:1px solid var(--line-2)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
td.num,td .num{font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:#fafbfc}
tbody tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#eef4fa}
tr.total td{font-weight:700;background:#eef1f5!important;border-top:1px solid var(--line-2)}
tr.detail td{background:var(--sunk)!important;white-space:normal}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 6px;border-radius:2px;margin-right:4px;white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:#c5e1cf}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:#ecd9a8}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:#f0c4be}
.chip.info{background:#e7eef7;color:var(--brand-2);border-color:#c8d7ea}
.chip.plain{background:#f1f2f4;color:#4b5563;border-color:#e0e3e7}
.working{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 28px;padding:6px 2px}
.working dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:.84rem}
.working dt{color:var(--muted)}
.working dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.working h4{margin:0 0 6px;font-size:.84rem;font-weight:700;color:var(--brand)}
.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.src{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:3px;padding:10px 12px;display:grid;gap:6px;background:#fff}
.src.loaded{border-left-color:var(--good)}
.src .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.src .used{font-size:.74rem;color:var(--muted)}
.mapper{border:1px solid var(--accent);border-radius:3px;padding:14px;display:grid;gap:10px;background:#f3f8fd}
.maprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.notice{border-radius:3px;padding:10px 14px;font-size:.88rem;display:grid;gap:6px;border:1px solid var(--line);border-left-width:4px}
.notice.warn{background:#fffaf0;color:var(--ink);border-color:#ecd9a8;border-left-color:#d49a1a}
.notice.info{background:#fff;border-left-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
td input[type=text],td input[type=number],td input[type=date],td select{padding:4px 6px;width:100%}
td input.w-num{width:96px}
td input.w-name{min-width:150px}
td input.w-alias{min-width:170px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--brand);color:#fff;padding:8px 16px;border-radius:3px;font-size:.86rem;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.readonly-note{font-size:.82rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--brand)}
details.panel:not([open]){gap:0}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sum{display:grid;gap:16px}
.sum-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-end}
.sum-head h2{font-size:1.35rem;font-weight:700;color:var(--brand)}
.sum-head .sub{color:var(--muted);font-size:.88rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sum-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.sum-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.sum-card .l{font-size:.8rem;color:var(--muted);font-weight:500}
.sum-card .v{font-size:1.6rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.sum-card .s{font-size:.78rem;color:var(--muted)}
.sum-card.hero{background:var(--brand);border-color:var(--brand);grid-column:span 2}
.sum-card.hero .l,.sum-card.hero .s{color:#b9c6d6}.sum-card.hero .v{color:#fff;font-size:1.9rem}
@media (max-width:520px){.sum-card.hero{grid-column:auto}}
.sum-split{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.sum-split .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#eef0f3}
.sum-split .bar span{display:block;height:100%}
.sum-legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.84rem}
.sum-legend b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.c-old{background:#7c8da3}.c-new{background:var(--accent)}.c-bon{background:#d49a1a}
.sum-tablecard{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum-tablecard .tablewrap{border:none;border-radius:0}
.sum-table th{background:#fff;color:var(--muted);font-weight:600;font-size:.78rem;border-bottom:1px solid var(--line);padding:10px 12px;white-space:normal;line-height:1.25}
.sum-table td{padding:10px 12px;border-bottom:1px solid #f0f1f3}
.sum-table tbody tr:nth-child(even) td{background:#fff}
.sum-table tbody tr:hover td{background:#f7f9fc}
.sum-table tr.grp td{background:#f8f9fb!important;font-weight:600;color:var(--ink);font-size:.82rem;padding:8px 12px;border-bottom:1px solid var(--line)}
.sum-table tr.grp .cnt{color:var(--muted);font-weight:400;margin-left:6px}
.sum-table tr.grp .amt{float:right;font-variant-numeric:tabular-nums}
.sum-table td.notes{white-space:normal;min-width:200px;max-width:280px}
.sum-table td.notes .chip{white-space:normal;margin:1px 3px 1px 0}
.sum-table tr.total td{background:#f3f5f8!important;border-top:1px solid var(--line-2)}
.who{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;flex:none}
.convbar{display:inline-block;width:46px;height:5px;border-radius:3px;background:#eef0f3;vertical-align:middle;margin-left:8px;overflow:hidden}
.convbar i{display:block;height:100%;background:var(--accent)}
.planlbl{font-size:.8rem;white-space:nowrap}
.demo-banner{border-color:#ecd9a8!important;border-left-color:#d49a1a!important;background:#fffaf0!important}
@media print{header.top,nav.tabs{display:none}}
</style>
</head>

    const inNM=sum(A.inboundNoMissed.get(p.name),"calls"), outb=sum(A.outbound.get(p.name),"calls");
    const csat=avg(A.csat.get(p.name),"score"), nps=avg(A.nps.get(p.name),"score",ratio), lead=avg(A.leadScore.get(p.name),"score",ratio);
    const cRows=A.cancellations.get(p.name)||[];
    const cancels=cRows.reduce((a,r)=>a+(r.count!=null&&r.count!==""? (num(r.count)||0) : 1),0);
    const unreported=cRows.some(r=>no(r.reported));
    const conv = inAll ? deals/inAll : (deals>0? null : null);
    const policies=(A.insurance.get(p.name)||[]).reduce((a,r)=>a+(r.policies!=null&&r.policies!==""? (num(r.policies)||0) : 1),0);
    const bonusRows=A.bonus.get(p.name)||[];
    const bonus=bonusRows.reduce((a,r)=>a+(num(r.bonus)||0)+(num(r.oneoff)||0),0);
    const reviews=(A.trustpilot.get(p.name)||[]);
    const days=num(inp.days), owed=num(inp.owed)||0;
    const stipend = p.stipend ? Math.round(num(p.stipend) * (days!=null? days/wd : 1)) : 0;
    const insurance=policies*B.insurance;
    const reviewRate = p.role==="Service" ? B.reviewService : (p.higherRate ? B.reviewHigher : B.reviewCM);
    const row={name:p.name, arabicName:p.arabicName||"", role:p.role, plan:p.plan||"none", pax, deals, inAll, inNM, outb, csat, nps, lead, cancels, conv, policies, bonus, stipend, insurance,
      reviewCount:reviews.length, reviewRate, owed, days, flags:[], commUSD:0, msUSD:0, override:(p.override===""||p.override==null)? null : num(p.override)};
    let reviewPay = reviews.length*reviewRate;
    const attIn = (inp.att!=null && inp.att!=="") ? ratio(inp.att) : avg(A.attendance.get(p.name),"pct",ratio);
    row.att=attIn; row.ramp=inRamp(p.startDate,mid,AT.rampDays); row.attLoss=0;
    const attApplies = AT.enabled && attIn!=null && !row.ramp;
    if(AT.enabled && row.plan!=="none"){ if(row.ramp) row.flags.push(["info","First "+AT.rampDays+" days, attendance not applied"]); else if(attIn==null) row.flags.push(["plain","No attendance data"]); }

    if(row.plan==="pax"){
      const fin=Math.max(0,pax-cancels); row.finalPax=fin;
      const tier=[...settings.pax.tiers].sort((a,b)=>a.min-b.min).filter(t=>fin>=t.min).pop();
      row.paxRate=tier? tier.rate : 0;
      row.effInbound = inNM + Math.floor(outb/(settings.pax.outboundPerCredit||10));
      let lvl=settings.pax.levels[0];
      for(const L of settings.pax.levels){
        const ok=(conv!=null && conv>=L.conv) && (L.csat==null || (csat!=null && csat>=L.csat)) && (L.nps==null || (nps!=null && nps>=L.nps)) && (L.inb==null || row.effInbound>=L.inb);
        if(ok && L.mult>=lvl.mult) lvl=L;
      }
      let cap=null;
      if(attApplies){
        if(attIn < AT.gate) cap={name:"Not Qualified", mult:0};
        else { const c=AT.caps.filter(x=>attIn>=x.min).sort((a,b)=>a.min-b.min).pop(); const L=c && settings.pax.levels.find(x=>x.name===c.level); if(L && L.mult<lvl.mult) cap=L; }
      }
      const base=fin*row.paxRate; row.levelEarned=lvl.name; row.multEarned=lvl.mult;
      const use = (cap && !AT.shadow) ? cap : lvl;
      row.level=use.name; row.mult=use.mult;
      row.commUSD = row.override!=null ? row.override : base*use.mult;
      if(cap && row.override==null){ const loss=base*(lvl.mult-cap.mult); if(loss>0.005){ row.attLoss=loss;
        row.flags.push(AT.shadow? ["plain","Trial: attendance would cost "+usd(loss)] : (cap.mult===0? ["bad","Attendance under "+Math.round(AT.gate*100)+"%"] : ["warn","Attendance caps level at "+cap.name])); } }
      if(fin < settings.pax.tiers[0].min && row.override==null) row.flags.push(["plain",`Below ${settings.pax.tiers[0].min} pax`]);
      if(inAll==null && pax>0) row.flags.push(["warn","No inbound data"]);
    } else if(row.plan==="fp"){
      const F=settings.fp, src=A.fpBookings.get(p.name)||[]; let io=0, bs=0, excluded=0;
      for(const b of src){
        const cab=num(b.cabins)||0; const isGroup=cab>=F.groupCabins;
        const when = isGroup ? (b.sail||b.fpDate) : b.fpDate;
        if(!when || !when.startsWith(mid)) continue;
        if(b.stage!=null && b.stage!=="" && !norm(b.stage).includes(norm(F.stage))) { excluded++; continue; }
        if(b.cancelled!=null && yes(b.cancelled)) { excluded++; continue; }
        if(p.lastDay && b.fpDate && b.fpDate>p.lastDay) { excluded++; continue; }
        if(/balcon|suite/i.test(b.category||"")) bs++; else io++;
      }
      const count=io+bs; row.fpCount=count; row.fpIO=io; row.fpBS=bs; row.fpExcluded=excluded;
      const tiers=[...F.tiers].sort((a,b)=>a.min-b.min); let idx=-1; tiers.forEach((t,i)=>{ if(count>=t.min) idx=i; });
      row.tierEarned=idx+1;
      const miss=[];
      const chk=(val,min,label)=>{ if(val==null){ if(!F.missingMet) miss.push(label+" (no data)"); } else if(val<min) miss.push(label); };
      chk(conv,F.conv,"Conversion"); chk(csat,F.csat,"CSAT"); chk(lead,F.lead,"Lead score");
      row.misses=miss;
      const paid = idx<0 ? -1 : Math.max(0, idx-miss.length);
      row.tierPaid=paid+1; const t=tiers[paid];
      row.fpRateIO=t? t.io:0; row.fpRateBS=t? t.bs:0;
      let fp = t ? io*t.io + bs*t.bs : 0;
      row.unreported=unreported;
      if(unreported){ fp=0; row.flags.push(["bad","Unreported cancellation"]); }
      if(attApplies && attIn<AT.gate && fp>0 && row.override==null){ row.attLoss=fp;
        if(AT.shadow) row.flags.push(["plain","Trial: attendance would cost "+usd(fp)]); else { fp=0; row.flags.push(["bad","Attendance under "+Math.round(AT.gate*100)+"%"]); } }
      row.fpUSD=fp;
      const before=num(p.depositsToDate)||0; row.depositsBefore=before; row.depositsNow=before+deals;
      row.ms20 = (!p.ms20Paid && row.depositsNow>=20) ? F.ms20 : 0;
      row.ms25 = (!p.ms25Paid && count>=25) ? F.ms25 : 0;
      row.msUSD=row.ms20+row.ms25;
      row.commUSD = row.override!=null ? row.override : fp;
      if(miss.length && idx>=0){ const dr=Math.min(miss.length,idx); row.flags.push(["warn", dr? `Dropped ${dr} tier${dr===1?"":"s"}` : "Missed a standard, already tier 1"]); }
      if(row.msUSD) row.flags.push(["good","Milestone"]);
      const low=reviews.filter(r=>num(r.stars)!=null && num(r.stars)<B.minStars).length;
      if(low){ reviewPay=0; row.flags.push(["bad",`Review under ${B.minStars} stars`]); }
    }
    if(row.override!=null && row.plan!=="none") row.flags.push(["info", row.override===0? "No commission (fixed 0)" : "Fixed amount"]);
    row.reviews=reviewPay;
    row.commEGP=(row.commUSD+row.msUSD+owed)*rate;
    row.bonusTotal=insurance+stipend+bonus+reviewPay;
    row.total=Math.round((row.commEGP+row.bonusTotal)*100)/100;
    row.deduct=num(inp.deduct)||0; row.deductNote=inp.deductNote||""; row.method=inp.method||"";
    row.final=Math.round((row.total-row.deduct)*100)/100;
    rows.push(row);
  }
  const tot=k=>rows.reduce((a,r)=>a+(r[k]||0),0);
  const attLossUSD=tot("attLoss");
  return {rows, rate, wd, unmatched, totals:{total:tot("total"), commEGP:tot("commEGP"), bonus:tot("bonusTotal"), stipend:tot("stipend"), insurance:tot("insurance"), extra:tot("bonus"), reviews:tot("reviews"), deduct:tot("deduct"), final:rows.reduce((a,r)=>a+Math.max(0,r.final),0), paid:rows.filter(r=>r.total>0).length, attLossUSD, attShadow:AT.enabled&&AT.shadow, attOn:AT.enabled}};
}


/* ---------------- local storage (replaces Claude's saved data when hosted on GitHub Pages) ----------------
   Everything is kept in this browser on this device, under one key. Use Download backup / Restore backup
   to move it to another device or keep a copy. */
const DEMO = new URLSearchParams(location.search).has("demo");
const LS_KEY = DEMO ? "cruisehub.commission.demo.v1" : "cruisehub.commission.original.v1";
function demoDocs(){ try{ return JSON.parse(document.getElementById("demoData").textContent).docs; }catch(e){ return {}; } }
const LocalStore=(()=>{
  let docs={}; let ok=true;
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); docs=d.docs||{}; } }catch(e){ ok=false; }
  if(DEMO && !Object.keys(docs).length) docs=demoDocs();
  const docSubs=new Map(), colSubs=new Map();
  const colOf=p=>p.split("/")[0];
  const snapDoc=p=>({exists: docs[p]!==undefined, id:p.split("/")[1], data:()=>JSON.parse(JSON.stringify(docs[p]))});
  const snapCol=c=>({docs:Object.keys(docs).filter(k=>colOf(k)===c&&k.includes("/")).map(k=>({id:k.split("/")[1], data:()=>JSON.parse(JSON.stringify(docs[k]))}))});
  function persist(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({app:"cruisehub-commission",version:1,savedAt:new Date().toISOString(),docs})); ok=true; }
    catch(e){ ok=false; const err=new Error("quota"); err.code="quota_exceeded"; throw err; }
  }
  function notify(p){
    (docSubs.get(p)||new Set()).forEach(cb=>cb(snapDoc(p)));
    (colSubs.get(colOf(p))||new Set()).forEach(cb=>cb(snapCol(colOf(p))));
  }
  function merge(base,patch){
    for(const [k,v] of Object.entries(patch)){
      if(v && typeof v==="object" && !Array.isArray(v) && v.__delete__===true){ delete base[k]; continue; }
      if(v && typeof v==="object" && !Array.isArray(v)){ if(!base[k]||typeof base[k]!=="object"||Array.isArray(base[k])) base[k]={}; merge(base[k],v); }
      else base[k]=v;
    }
    return base;
  }
  const strip=o=>JSON.parse(JSON.stringify(o));
  const db={
    doc(p){ return {
      onSnapshot(cb){ if(!docSubs.has(p)) docSubs.set(p,new Set()); docSubs.get(p).add(cb); setTimeout(()=>cb(snapDoc(p)),0); return ()=>docSubs.get(p).delete(cb); },
      async set(data){ const prev=docs[p]; docs[p]=strip(data); try{ persist(); }catch(e){ docs[p]=prev; throw e; } notify(p); },
      async update(patch){ const prev=docs[p]; docs[p]=merge(strip(docs[p]||{}),strip(patch)); try{ persist(); }catch(e){ docs[p]=prev; throw e; } notify(p); }
    }; },
    collection(c){ return { onSnapshot(cb){ if(!colSubs.has(c)) colSubs.set(c,new Set()); colSubs.get(c).add(cb); setTimeout(()=>cb(snapCol(c)),0); return ()=>colSubs.get(c).delete(cb); } }; }
  };
  return {
    db, get ok(){ return ok; },
    exportJSON(){ return JSON.stringify({app:"cruisehub-commission",version:1,savedAt:new Date().toISOString(),docs},null,1); },
    importJSON(text){
      const d=JSON.parse(text); if(!d||d.app!=="cruisehub-commission"||!d.docs) throw new Error("not a backup");
      const prev=docs; docs=d.docs; try{ persist(); }catch(e){ docs=prev; throw e; }
      const paths=new Set([...Object.keys(prev),...Object.keys(docs),...docSubs.keys()]); paths.forEach(notify);
      return {people:(docs["config/roster"]?.people||[]).length, months:Object.keys(docs).filter(k=>k.startsWith("months/")).length};
    },
    hasData(){ return Object.keys(docs).length>0; }
  };
})();
function saveFile(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
const localDownloads={ async save({filename,data}){ saveFile(filename,data); } };

/* ---------------- db wiring ---------------- */
async function init(){
  try{
    S.db=LocalStore.db; S.downloads=localDownloads; S.canEdit=true;
  }catch(e){ S.db=null; }
  if(!S.db){ S.dbMissing=true; S.settings=clone(DEFAULT_SETTINGS); S.roster={people:[]}; S.months=[]; S.ready={settings:true,roster:true,months:true}; render(); return; }
  S.db.doc("config/settings").onSnapshot(s=>{ S.settings = s.exists ? {...clone(DEFAULT_SETTINGS), ...s.data()} : clone(DEFAULT_SETTINGS); S.ready.settings=true; render(); }, err);
  S.db.doc("config/roster").onSnapshot(s=>{ S.roster = s.exists ? clone(s.data()) : {people:[]}; S.roster.people ||= []; S.ready.roster=true; render(); }, err);
  S.db.collection("months").onSnapshot(q=>{
    S.months=q.docs.map(d=>d.id).sort(); S.ready.months=true;
    if(!S.monthId || !S.months.includes(S.monthId)) selectMonth(S.months[S.months.length-1]||null); else render();
  }, err);
}
function err(e){ console.warn(e); toast("Couldn't read saved data in this browser."); }
function selectMonth(id){
  if(S.unsubMonth){ S.unsubMonth(); S.unsubMonth=null; }
  S.monthId=id; S.month=null;
  if(!id){ render(); return; }
  S.unsubMonth=S.db.doc("months/"+id).onSnapshot(s=>{ S.month = s.exists ? clone(s.data()) : null; if(S.month) S.month.id=id; render(); }, err);
  render();
}
async function write(path, data, how="set"){
  if(!S.db || !S.canEdit){ toast("Saving is unavailable in this browser."); return false; }
  try{ await S.db.doc(path)[how](data); return true; }
  catch(e){ if(e.code==="quota_exceeded"||e.code==="invalid_argument") toast("That didn't save: this browser's storage is full. Download a backup, then remove old months' uploads."); else toast("That didn't save. Download a backup so nothing is lost."); return false; }
}
const saveSettings = () => write("config/settings", S.settings);
const saveRoster = () => write("config/roster", S.roster);
const saveMonth = patch => write("months/"+S.monthId, patch, "update");

/* ---------------- rendering ---------------- */
let renderQueued=false;
function render(){
  const ae=document.activeElement;
  if(ae && ae.closest && ae.closest("#app") && /INPUT|SELECT/.test(ae.tagName) && ae.type!=="file" && ae.type!=="checkbox"){ renderQueued=true; return; }
  renderQueued=false;
  if(!(S.ready.settings&&S.ready.roster&&S.ready.months)) return;
  const app=$("#app"); const sy=window.scrollY;
  const calc = S.month ? (S.month.closed && S.month.snapshot ? S.month.snapshot : compute(S.settings,S.roster,S.month)) : null;
  if(calc && !(calc.unmatched instanceof Map)) calc.unmatched=new Map(Object.entries(calc.unmatched||{}).map(([k,v])=>[k,new Set(v)]));
  app.innerHTML = headerHTML() + tabsHTML() + bodyHTML(calc);
  window.scrollTo(0,sy);
}
document.addEventListener("focusout",()=>setTimeout(()=>{ if(renderQueued) render(); },0));

  const planTotal=sumOf(mine,"total");

  const pax=c.rows.filter(r=>r.plan==="pax"), fp=c.rows.filter(r=>r.plan==="fp"), other=c.rows.filter(r=>r.plan==="none");
  const deals=sales.reduce((a,r)=>a+(r.deals||0),0), inb=sales.reduce((a,r)=>a+(r.inAll||0),0);
  const netUSD=r=>(r.commUSD||0)+(r.msUSD||0)+(r.owed||0);
  const totUSD=c.rows.reduce((a,r)=>a+netUSD(r),0);
  const totPax=pax.reduce((a,r)=>a+(r.finalPax||0),0), totFP=fp.reduce((a,r)=>a+(r.fpCount||0),0);
  const tot=list=>list.reduce((a,r)=>a+(r.total||0),0);

          <td class="r num">${fmt(totPax)} pax · ${fmt(totFP)} FP</td><td></td><td></td>

function sourceRows(key){
  const src=S.month.sources?.[key]; if(!src) return null;
  const pm=personMap(S.roster);
  return src.rows.map(r=>{ const p=pm.get(norm(r.agent??r.owner)); return {...r, person:p?p.name:null}; });
}
const stars = n => n==null? "" : "★".repeat(Math.max(0,Math.min(5,Math.round(n)))) + `<span class="muted">${"★".repeat(Math.max(0,5-Math.round(n)))}</span>`;
function reviewsHTML(c){
  const m=S.month, B=S.settings.bonus;

  if(!list) return `<section class="panel"><div class="empty"><h2>No reviews uploaded for ${monthLabel(m.id)}</h2><p>Upload the review export on Uploads & adjustments, one row per review.</p>${S.canEdit&&!m.closed?`<button class="primary" data-tab="data">Go to uploads</button>`:""}</div></section>`;
  const byPerson=new Map(); for(const r of list) if(r.person){ const a=byPerson.get(r.person)||[]; a.push(r); byPerson.set(r.person,a); }
  const people=c.rows.filter(r=>byPerson.has(r.name)||r.reviews).map(r=>{
    const rv=byPerson.get(r.name)||[]; const sc=rv.map(x=>num(x.stars)).filter(x=>x!=null);
    const low=sc.filter(x=>x<B.minStars).length; const earned=rv.length*r.reviewRate;
    return {r, rv, n:rv.length, avg:sc.length? sc.reduce((a,b)=>a+b,0)/sc.length : null, low, earned, paid:r.reviews};
  }).sort((a,b)=>b.n-a.n || a.r.name.localeCompare(b.r.name));
  const unmatched=list.filter(x=>!x.person);
  const allSc=list.map(x=>num(x.stars)).filter(x=>x!=null);
  const lowAll=allSc.filter(x=>x<B.minStars).length;
  const zeroed=people.filter(p=>p.n && p.paid===0 && p.earned>0);
  const plats=new Map(); for(const r of list){ const k=(r.platform||"Not stated").trim()||"Not stated"; plats.set(k,(plats.get(k)||0)+1); }
  const rateLbl=r=> r.role==="Service"?"Service rate":(r.reviewRate===B.reviewHigher&&B.reviewHigher!==B.reviewCM?"Higher rate":"Standard rate");
  return `
  <section class="kpis">
    <div class="kpi lead"><span class="eyebrow">Review bonus paid</span><span class="v">${egp(people.reduce((a,p)=>a+p.paid,0))} EGP</span><span class="small muted">${people.filter(p=>p.paid>0).length} people</span></div>
    <div class="kpi"><span class="eyebrow">Reviews this month</span><span class="v">${list.length}</span><span class="small muted">${[...plats].map(([k,v])=>`${esc(k)} ${v}`).join(" · ")}</span></div>
    <div class="kpi"><span class="eyebrow">Average rating</span><span class="v">${allSc.length? fmt(allSc.reduce((a,b)=>a+b,0)/allSc.length,2) : "-"}</span><span class="small muted">${allSc.length? stars(allSc.reduce((a,b)=>a+b,0)/allSc.length) : "no ratings in file"}</span></div>
    <div class="kpi"><span class="eyebrow">Under ${B.minStars} stars</span><span class="v">${lowAll}</span><span class="small muted">${zeroed.length? `${zeroed.length} review bonus${zeroed.length===1?"":"es"} zeroed` : "no bonus lost"}</span></div>
  </section>
  ${unmatched.length?`<div class="notice warn"><strong>${unmatched.length} review${unmatched.length===1?"":"s"} not credited to anyone</strong><span>The name on ${unmatched.length===1?"it":"them"} matches nobody on the team: ${[...new Set(unmatched.map(x=>String(x.agent??"").trim()||"blank"))].map(esc).join(", ")}. Link the name on the New rules tab, or fix the export, and the review counts.</span></div>`:""}
  <section class="panel">
    <div><h2>Reviews by person · ${monthLabel(m.id)}</h2>

/* ---- insurance sold ---- */
function insuranceHTML(c){
  const m=S.month, B=S.settings.bonus;
  const list=sourceRows("insurance");
  if(!list) return `<section class="panel"><div class="empty"><h2>No insurance uploaded for ${monthLabel(m.id)}</h2><p>Upload the insurance export on Uploads & adjustments. One row per policy works, or one row per person with a policy count.</p>${S.canEdit&&!m.closed?`<button class="primary" data-tab="data">Go to uploads</button>`:""}</div></section>`;
  const cnt=r=> r.policies!=null&&r.policies!==""? (num(r.policies)||0) : 1;
  const prem=r=> num(r.premium);
  const hasPrem=list.some(r=>prem(r)!=null), hasDetail=list.some(r=>r.booking||r.customer||r.product||r.date);
  const byPerson=new Map(); for(const r of list) if(r.person){ const a=byPerson.get(r.person)||[]; a.push(r); byPerson.set(r.person,a); }
  const people=c.rows.filter(r=>r.policies>0).map(r=>{ const rows=byPerson.get(r.name)||[];
    const prods=new Map(); rows.forEach(x=>{ if(x.product){ prods.set(x.product,(prods.get(x.product)||0)+cnt(x)); } });
    return {r, rows, policies:r.policies, bonus:r.insurance, premium: hasPrem? rows.reduce((a,x)=>a+(prem(x)||0),0) : null, prods};
  }).sort((a,b)=>b.policies-a.policies || a.r.name.localeCompare(b.r.name));
  const unmatched=list.filter(x=>!x.person);
  const totPol=people.reduce((a,p)=>a+p.policies,0), totBonus=people.reduce((a,p)=>a+p.bonus,0), totPrem=hasPrem? people.reduce((a,p)=>a+(p.premium||0),0) : null;
  const top=people[0];
  return `
  <section class="kpis">
    <div class="kpi lead"><span class="eyebrow">Insurance bonus paid</span><span class="v">${egp(totBonus)} EGP</span><span class="small muted">${B.insurance} EGP per policy</span></div>
    <div class="kpi"><span class="eyebrow">Policies sold</span><span class="v">${totPol}</span><span class="small muted">${people.length} ${people.length===1?"person":"people"} sold</span></div>
    ${hasPrem?`<div class="kpi"><span class="eyebrow">Premium sold</span><span class="v">${usd(totPrem)}</span><span class="small muted">from the export</span></div>`:""}
    <div class="kpi"><span class="eyebrow">Top seller</span><span class="v" style="font-size:1.05rem">${top?esc(top.r.name):"-"}</span><span class="small muted">${top?`${top.policies} polic${top.policies===1?"y":"ies"}`:""}</span></div>
  </section>
  ${unmatched.length?`<div class="notice warn"><strong>${unmatched.reduce((a,r)=>a+cnt(r),0)} polic${unmatched.reduce((a,r)=>a+cnt(r),0)===1?"y":"ies"} not credited to anyone</strong><span>The seller name matches nobody on the team: ${[...new Set(unmatched.map(x=>String(x.agent??"").trim()||"blank"))].map(esc).join(", ")}. Link the name on the New rules tab and the bonus is added.</span></div>`:""}
  <section class="panel">
    <div><h2>Insurance sold by person · ${monthLabel(m.id)}</h2><p class="small muted">Every policy pays ${B.insurance} EGP, on both plans and for every role. The rate is on Rates & rules.</p></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Person</th><th>Plan</th><th class="r">Policies</th>${people.some(p=>p.prods.size)?`<th>Products</th>`:""}${hasPrem?`<th class="r">Premium USD</th>`:""}<th class="r">Share</th><th class="r">Bonus EGP</th></tr></thead>
      <tbody>${people.map(p=>`<tr><td><strong>${esc(p.r.name)}</strong><div class="muted small">${esc(p.r.role||"")}</div></td><td>${p.r.plan==="fp"?`<span class="chip info">New</span>`:p.r.plan==="pax"?`<span class="chip plain">Old</span>`:`<span class="chip plain">Bonus only</span>`}</td>
        <td class="r num">${p.policies}</td>${people.some(q=>q.prods.size)?`<td class="small">${[...p.prods].map(([k,v])=>`${esc(k)} ${v}`).join(" · ")}</td>`:""}${hasPrem?`<td class="r num">${usd(p.premium)}</td>`:""}
        <td class="r num">${totPol? pct(p.policies/totPol) : ""}</td><td class="r num"><strong>${egp(p.bonus)}</strong></td></tr>`).join("") || `<tr><td colspan="6" class="empty">No policies matched anyone on the team.</td></tr>`}
      <tr class="total"><td colspan="2">Total</td><td class="r num">${totPol}</td>${people.some(p=>p.prods.size)?"<td></td>":""}${hasPrem?`<td class="r num">${usd(totPrem)}</td>`:""}<td></td><td class="r num">${egp(totBonus)}</td></tr></tbody>
    </table></div>
  </section>
  ${hasDetail?`<details class="panel"><summary>Every policy in the file (${list.length})</summary>
    <div class="tablewrap"><table>
      <thead><tr><th>Sold by (in file)</th><th>Credited to</th><th>Date</th><th>Booking</th><th>Customer</th><th>Product</th>${hasPrem?`<th class="r">Premium USD</th>`:""}<th class="r">Policies</th></tr></thead>
      <tbody>${list.slice().sort((a,b)=>String(a.person||"~").localeCompare(String(b.person||"~"))||String(a.date||"").localeCompare(String(b.date||""))).map(r=>`<tr><td>${esc(r.agent??"")}</td><td>${r.person?esc(r.person):`<span class="chip warn">No match</span>`}</td><td class="num">${esc(r.date||"")}</td><td class="num">${esc(r.booking||"")}</td><td>${esc(r.customer||"")}</td><td>${esc(r.product||"")}</td>${hasPrem?`<td class="r num">${usd(prem(r))}</td>`:""}<td class="r num">${cnt(r)}</td></tr>`).join("")}</tbody>
    </table></div></details>`:`<p class="small muted">Tip: upload one row per policy with booking, customer, product and premium columns and this tab will list every policy too.</p>`}`;
}

  const people=c.rows;
  const adj=`<section class="panel"><div><h2>Month adjustments</h2><p class="small muted">Days worked prorates the transportation allowance for joiners and leavers. Leave blank for a full month. Attendance % only needs typing if it isn't in the attendance upload or is wrong there (type 96 for 96%). Last month owed is in USD and is converted at this month's rate.</p></div>

    ${people.map(r=>{ const i=m.inputs?.[r.name]||{}; return `<tr><td>${esc(r.name)}</td>
      <td><input type="number" class="w-num" data-inp="days" data-who="${esc(r.name)}" value="${esc(i.days??"")}" placeholder="full" ${ro?"disabled":""}></td>
      <td><input type="number" step="0.1" class="w-num" data-inp="att" data-who="${esc(r.name)}" value="${esc(i.att??"")}" placeholder="${r.att==null?"":(r.att*100).toFixed(1)}" ${ro?"disabled":""}></td>
      <td><input type="number" step="0.01" class="w-num" data-inp="owed" data-who="${esc(r.name)}" value="${esc(i.owed??"")}" placeholder="0" ${ro?"disabled":""}></td>
      <td><input type="text" data-inp="note" data-who="${esc(r.name)}" value="${esc(i.note??"")}" ${ro?"disabled":""}></td></tr>`; }).join("")}
    </tbody></table></div></section>`;
  return `<section class="panel"><div class="spread"><div><h2>Exports for ${monthLabel(m.id)}</h2><p class="small muted">Upload each report as it comes out of HubSpot, AiCall or the review export, in Excel or CSV. Uploading again replaces the earlier file.</p></div></div>
    ${m.closed?`<div class="notice info">This month is closed. Reopen it on either plan tab to change files.</div>`:""}

}

/* ---------------- uploads ---------------- */
function readFile(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ try{ res(XLSX.read(fr.result,{type:"array",cellDates:true})); }catch(e){ rej(e);} }; fr.onerror=rej; fr.readAsArrayBuffer(file); });
}
function sheetRows(wb,name){
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
  let h=aoa.findIndex(r=>r.filter(v=>String(v).trim()!=="").length>=2); if(h<0) h=0;
  const headers=(aoa[h]||[]).map(v=>String(v).trim());
  const data=aoa.slice(h+1).filter(r=>r.some(v=>String(v).trim()!==""));
  return {headers,data};
}
function guessMap(src,headers){
  const map={}, used=new Set(); const H=headers.map(norm);
  for(const [f,,words] of src.fields){
    let best=-1;
    for(const w of words){ const i=H.findIndex((h,ix)=>!used.has(ix)&&h.includes(w)); if(i>=0){best=i;break;} }
    if(best>=0){ map[f]=best; used.add(best); }
  }
  return map;
}
async function onFile(key,file){
  if(!window.XLSX){ toast("The spreadsheet reader didn't load. Reload the page and try again."); return; }
  try{
    const wb=await readFile(file); const src=SOURCES.find(s=>s.key===key);
    const hints=[norm(src.label), norm(src.label).split(" (")[0], ...(src.key==="trustpilot"?["trustpilot","trust pilot"]:[]), ...(src.key==="inboundNoMissed"?["no missed"]:[]), ...(src.key==="inboundAll"?["inbound all"]:[])];
    const sheet=wb.SheetNames.find(n=>hints.some(h=>h && norm(n).includes(h))) || wb.SheetNames.find(n=>hints.some(h=>h && h.includes(norm(n)) && norm(n).length>2)) || wb.SheetNames[0];
    const {headers,data}=sheetRows(wb,sheet);
    S.pending={key,file:file.name,wb,sheets:wb.SheetNames,sheet,headers,data,map:guessMap(src,headers)};
    render();
  }catch(e){ toast("That file couldn't be read. Save it as .xlsx or .csv and try again."); }
}
async function savePending(){
  const mp=S.pending, src=SOURCES.find(s=>s.key===mp.key);
  for(const [f,label,,opt] of src.fields) if(!opt && mp.map[f]==null){ toast(`Choose the column for ${label}.`); return; }
  const dateF=new Set(["fpDate","sail","date"]);
  const rows=mp.data.map(r=>{ const o={}; for(const [f] of src.fields){ const i=mp.map[f]; if(i==null) continue; let v=r[i]; if(dateF.has(f)) v=isoDate(v); else if(v instanceof Date) v=isoDate(v); else v=(typeof v==="string")? v.trim() : v; o[f]=v; } return o; })
    .filter(o=>norm(o.agent??o.owner) && !/^(total|grand total|sum)$/i.test(String(o.agent??o.owner).trim()));
  const ok=await saveMonth({sources:{[mp.key]:{file:mp.file,at:new Date().toISOString(),label:src.label,rows}}});
  if(ok){ S.pending=null; toast(`${src.label}: ${rows.length} rows saved`); render(); }
}

/* ---------------- exports ---------------- */
function currentCalc(){ return S.month.closed && S.month.snapshot ? S.month.snapshot : compute(S.settings,S.roster,S.month); }
function csv(rows){ return rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\r\n"); }
function payrollRows(c){ const f=r=>r.final??r.total; const list=c.rows.filter(r=>r.total>0||r.deduct); return [["Western name","Arabic name","Role","Plan","Commission EGP","Insurance EGP","Transportation allowance EGP","Bonus EGP","Reviews EGP","Earned EGP","Deduction EGP","Deduction reason","Final transfer EGP","Paid by"], ...list.map(r=>[r.name,r.arabicName||"",r.role,PLANS[r.plan],Math.round(r.commEGP),r.insurance,r.stipend,r.bonus,r.reviews,Math.round(r.total),r.deduct||0,r.deductNote||"",Math.round(Math.max(0,f(r))),r.method||""]), ["TOTAL","","","",Math.round(c.totals.commEGP),c.totals.insurance,c.totals.stipend,c.totals.extra,c.totals.reviews,Math.round(c.totals.total),c.rows.reduce((a,r)=>a+(r.deduct||0),0),"",Math.round(c.rows.reduce((a,r)=>a+Math.max(0,f(r)),0)),""]]; }
function detailRows(c){ return [["Western name","Arabic name","Role","Plan","Deals","Pax","Final pax","FP bookings","Inbound incl missed","Conversion","Attendance","CSAT","NPS","Lead score","Cancellations","Level / tier paid","Multiplier","Commission USD","Milestones USD","Owed USD","Rate","Commission EGP","Insurance","Transportation allowance","Bonus","Reviews","Total EGP","Deduction EGP","Deduction reason","Final transfer EGP","Paid by","Checks"],
  ...c.rows.map(r=>[r.name,r.arabicName||"",r.role,PLANS[r.plan],r.deals,r.pax,r.finalPax??"",r.fpCount??"",r.inAll??"",r.conv==null?"":(r.conv*100).toFixed(1)+"%",r.att==null?"":(r.att*100).toFixed(1)+"%",r.csat??"",r.nps==null?"":(r.nps*100).toFixed(1)+"%",r.lead==null?"":(r.lead*100).toFixed(1)+"%",r.cancels,r.plan==="pax"?r.level:r.plan==="fp"?"Tier "+r.tierPaid:"",r.mult??"",r.commUSD.toFixed(2),r.msUSD,r.owed,c.rate,r.commEGP.toFixed(2),r.insurance,r.stipend,r.bonus,r.reviews,r.total.toFixed(2),r.deduct||0,r.deductNote||"",(r.final??r.total).toFixed(2),r.method||"",r.flags.map(f=>f[1]).join("; ")])]; }
async function download(name,rows){
  try{ await S.downloads.save({filename:name,data:new Blob(["﻿"+csv(rows)],{type:"text/csv"})}); }
  catch(e){ if(e.code!=="declined") toast("The download didn't start. Use Copy HR payroll instead."); }
}

/* ---------------- events ---------------- */
function setPath(obj,path,val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=val; }
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,tr[data-open]"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{localStorage.setItem("chcc.tab",S.tab);}catch(_){} render(); return; }
  if(t.dataset.open!=null){ S.open[t.dataset.open]=!S.open[t.dataset.open]; render(); return; }
  if(t.id==="newMonth"||t.id==="newMonth2"){
    const id = S.months.length ? nextMonthId(S.months[S.months.length-1]) : currentMonthId();
    const prev = S.month;
    if(await write("months/"+id,{id,rate:prev?.rate??S.settings.rate,workingDays:S.settings.workingDays,sources:{},inputs:{},ignored:prev?.ignored||[],closed:false})){ selectMonth(id); toast(monthLabel(id)+" started"); }
    return;
  }
  if(t.id==="resetDemo"){ if(confirm("Put the demo back to its starting figures?")){ try{ localStorage.removeItem(LS_KEY); }catch(_){} location.reload(); } return; }
  if(t.id==="backupData"){ saveFile(`day1-commission-backup-${new Date().toISOString().slice(0,10)}.json`, new Blob([LocalStore.exportJSON()],{type:"application/json"})); toast("Backup downloaded. Keep it somewhere safe."); return; }
  if(t.id==="restoreData"){ $("#restoreFile").click(); return; }
  if(t.dataset.clear){ await saveMonth({sources:{[t.dataset.clear]:{"__delete__":true}}}); return; }
  if(t.id==="mpCancel"){ S.pending=null; render(); return; }
  if(t.id==="mpSave"){ savePending(); return; }
  if(t.dataset.ignore){ const ig=[...(S.month.ignored||[]),t.dataset.ignore]; await saveMonth({ignored:ig}); return; }
  if(t.id==="addPerson"){ S.roster.people.push({name:"New person",aliases:"",role:"Cruise Manager",plan:"fp",stipend:2000,status:"active"}); await saveRoster(); return; }
  if(t.dataset.del!=null){ S.confirmDel=+t.dataset.del; render(); return; }
  if(t.dataset.delyes!=null){ S.roster.people.splice(+t.dataset.delyes,1); S.confirmDel=null; await saveRoster(); return; }
  if(t.id==="copyPay"){ const rows=payrollRows(currentCalc()).map(r=>r.join("\t")).join("\n"); try{ await navigator.clipboard.writeText(rows); toast("Transfer list copied. Paste it into Sheets or an email."); }catch(_){ toast("Copy isn't allowed here. Use Download payroll CSV."); } return; }
  if(t.id==="dlPay"){ download(`Day1_${S.monthId}_Bank_Transfers.csv`,payrollRows(currentCalc())); return; }
  if(t.id==="dlDetail"){ download(`Day1_${S.monthId}_Commission_Detail.csv`,detailRows(currentCalc())); return; }
  if(t.id==="closeMonth"){ S.confirmClose=true; render(); return; }
  if(t.id==="cancelClose"){ S.confirmClose=false; render(); return; }
  if(t.id==="confirmClose"){
    const c=compute(S.settings,S.roster,S.month); const effects={};
    for(const r of c.rows){ if(r.plan!=="fp") continue; const p=S.roster.people.find(x=>x.name===r.name); if(!p) continue;
      effects[p.name]={depositsToDate:p.depositsToDate??0,ms20Paid:!!p.ms20Paid,ms25Paid:!!p.ms25Paid};
      p.depositsToDate=r.depositsNow; if(r.ms20) p.ms20Paid=true; if(r.ms25) p.ms25Paid=true; }
    const snap={...c, unmatched:Object.fromEntries([...c.unmatched].map(([k,v])=>[k,[...v]]))};
    if(await saveMonth({closed:true,closedAt:new Date().toISOString(),snapshot:snap,closeEffects:effects})){ await saveRoster(); S.confirmClose=false; toast(monthLabel(S.monthId)+" closed"); }
    return;
  }
  if(t.id==="reopen"){
    const eff=S.month.closeEffects||{}; for(const [n,v] of Object.entries(eff)){ const p=S.roster.people.find(x=>x.name===n); if(p) Object.assign(p,v); }
    if(await saveMonth({closed:false,snapshot:{"__delete__":true},closeEffects:{"__delete__":true}})){ await saveRoster(); toast("Month reopened"); }
    return;
  }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="restoreFile"){ const f=t.files[0]; t.value=""; if(!f) return;
    try{ const text=await f.text(); if(LocalStore.hasData() && !confirm("Replace everything in this browser with this backup? Download a backup of the current data first if you need it.")) return;
      const r=LocalStore.importJSON(text); S.pending=null; toast(`Restored ${r.people} people and ${r.months} month${r.months===1?"":"s"}`); }
    catch(err){ toast("That file isn't a backup from this calculator."); }
    return; }
  if(t.id==="monthSel"){ S.pending=null; selectMonth(t.value); return; }
  if(t.id==="mRate"){ await saveMonth({rate:num(t.value)}); return; }
  if(t.id==="mWd"){ await saveMonth({workingDays:num(t.value)}); return; }
  if(t.dataset.file){ const f=t.files[0]; if(f) onFile(t.dataset.file,f); return; }
  if(t.id==="mpSheet"){ const mp=S.pending; const {headers,data}=sheetRows(mp.wb,t.value); Object.assign(mp,{sheet:t.value,headers,data,map:guessMap(SOURCES.find(s=>s.key===mp.key),headers)}); render(); return; }
  if(t.dataset.map){ S.pending.map[t.dataset.map]= t.value===""? null : +t.value; return; }
  if(t.dataset.linksel){ if(!t.value) return; const p=S.roster.people.find(x=>x.name===t.value); const al=(p.aliases||"").split(",").map(s=>s.trim()).filter(Boolean); al.push(t.dataset.linksel); p.aliases=al.join(", "); if(await saveRoster()) toast(`${t.dataset.linksel} now counts for ${p.name}`); return; }
  if(t.dataset.inp){ const who=t.dataset.who, k=t.dataset.inp; const v = ["note","deductNote","method"].includes(k) ? t.value : num(t.value); await saveMonth({inputs:{[who]:{[k]:v}}}); return; }
  if(t.dataset.p!=null){ const p=S.roster.people[+t.dataset.p], f=t.dataset.f;
    let v = t.type==="checkbox" ? t.checked : t.value;
    if(["stipend","depositsToDate"].includes(f)) v=num(v); if(f==="override") v= t.value===""? null : num(v);
    if(f==="name"){ const old=p.name; v=v.trim(); if(!v) return; if(S.month?.inputs?.[old] && !S.month.closed){ await saveMonth({inputs:{[v]:S.month.inputs[old],[old]:{"__delete__":true}}}); } }
    p[f]=v; await saveRoster(); return; }
  if(t.dataset.set){ const v = t.type==="number" ? (t.value===""? null : num(t.value)) : t.value; setPath(S.settings,t.dataset.set,v); await saveSettings(); return; }
  if(t.dataset.setbool){ setPath(S.settings,t.dataset.setbool,t.checked); await saveSettings(); return; }
});

init();
</script>
